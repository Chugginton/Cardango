<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CARDANGO</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: {
              400: '#10cfec',
              500: '#00b8cc',
              600: '#0097a7',
            }
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Full-viewport canvas styling */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #10cfec;
      background-image: radial-gradient(rgba(14, 116, 144, 0.42) 2.5px, transparent 2.5px);
      background-size: 28px 28px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Fixed Map Container (Locked in place - does not move/drag) */
    #mapStage {
      position: relative;
      width: 100%;
      max-width: 1140px;
      aspect-ratio: 1024 / 572;
      margin: 0 auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #mapStage img.map-base-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 20px 30px rgba(0, 40, 70, 0.22));
    }

    /* Hotspot Pill over Map Text */
    .zone-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 25;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      touch-action: manipulation;
    }

    .zone-hotspot:hover {
      transform: translate(-50%, -50%) scale(1.08);
      z-index: 35;
    }

    .zone-hotspot:active {
      transform: translate(-50%, -50%) scale(0.96);
    }

    /* Hotspot pulse rings */
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .pulse-beacon {
      animation: pulseRing 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    /* Hotspot hover preview card */
    .zone-preview-card {
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .zone-hotspot:hover .zone-preview-card {
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Glass Panels */
    .polecat-glass {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 16px 36px -10px rgba(0, 45, 80, 0.2), 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    /* ═══════════════════════════════════════════════════════
       SUBTLE GLITCH & SLIDE CARD TRANSITION (On Click)
       ═══════════════════════════════════════════════════════ */
    @keyframes pillGlitchTwitch {
      0%   { transform: translate(-50%, -50%) scale(1); filter: none; }
      20%  { transform: translate(-52%, -49%) scale(1.05); filter: drop-shadow(-2px 0 0 #00ffff) drop-shadow(2px 0 0 #ff007f); }
      45%  { transform: translate(-48%, -51%) scale(1.03); filter: drop-shadow(2px 0 0 #00ffff) drop-shadow(-2px 0 0 #ff007f); }
      70%  { transform: translate(-51%, -50%) scale(1.06); filter: none; }
      100% { transform: translate(-50%, -50%) scale(1.04); filter: none; }
    }

    .glitch-active {
      animation: pillGlitchTwitch 0.28s ease-in-out forwards !important;
    }

    /* Subtle Card Slide-In Toast Notification */
    #cardSlideToast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 60;
      transform: translateY(130%) scale(0.92);
      opacity: 0;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
      pointer-events: none;
    }

    #cardSlideToast.active {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* Scanline Glitch on card */
    @keyframes scanlineSweep {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(200%); }
    }
    .scanline-effect {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.5), transparent);
      animation: scanlineSweep 0.55s linear infinite;
      pointer-events: none;
    }
  </style>
</head>

  <!-- ==================== CART DRAWER MODAL ==================== -->
  <div id="cartDrawerModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-end">
    <div class="w-full max-w-sm bg-white h-full shadow-2xl flex flex-col justify-between p-4 border-l border-sky-200">
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <h3 class="text-sm font-bold text-slate-900">Your CARDANGO Cart</h3>
          <button onclick="closeCartDrawer()" class="text-slate-400 hover:text-slate-900 text-lg">✕</button>
        </div>
        <div id="cartDrawerItems" class="space-y-2 mt-3 max-h-[65vh] overflow-y-auto"></div>
      </div>
      <div class="pt-3 border-t border-slate-100">
        <div class="flex justify-between items-center text-xs font-bold text-slate-900 mb-3">
          <span>Total Est. Value:</span>
          <span id="cartDrawerTotal" class="text-sm text-sky-600 font-black">₹0</span>
        </div>
        <button onclick="checkoutCart()" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-xl shadow-md">
          Proceed to Escrow Checkout
        </button>
      </div>
    </div>
  </div>

  <!-- Main Cardango Logic (Auth, Cart, Sync, Store) -->
  <script src="app.js"></script>

  <!-- ==================== SUBTLE GLITCH & SLIDE SCRIPT ==================== -->
  <script>
    /**
     * Subtle cyber glitch on clicked pill + smooth card slide toast
     * Quick & snappy ~360ms transition to category catalog
     */

    function handleZoneClick(pillId, zoneName, icon, subtext, cardImg, cardTitle, destinationUrl) {
      const pill = document.getElementById(pillId);
      if (pill) {
        pill.classList.add('glitch-active');
      }

      // Show subtle slide toast in bottom-right corner
      const toast = document.getElementById('cardSlideToast');
      const imgEl = document.getElementById('toastCardImg');
      const zoneEl = document.getElementById('toastZoneTitle');
      const iconEl = document.getElementById('toastIcon');
      const nameEl = document.getElementById('toastCardName');

      if (imgEl) imgEl.src = cardImg;
      if (zoneEl) zoneEl.textContent = zoneName;
      if (iconEl) iconEl.textContent = icon;
      if (nameEl) nameEl.textContent = cardTitle;

      if (toast) {
        toast.classList.add('active');
      }

      // Snappy subtle slide transition before navigating
      setTimeout(() => {
        window.location.href = destinationUrl;
      }, 380);
    }
  </script>
